<svg xmlns="http://www.w3.org/2000/svg" width="960" height="166" viewBox="0 0 960 166" role="img"><title>Focus areas: web security, network security, and CTF challenges</title><g transform="translate(1 1)" font-family="Arial,Helvetica,sans-serif"><rect width="306" height="164" rx="14" fill="#111722" stroke="#30394b"/><text x="24" y="38" font-family="monospace" font-size="13" fill="#79e2c0">01 / SECURITY LAB</text><text x="24" y="78" font-size="21" font-weight="700" fill="#edf2fa">Web security</text><text x="24" y="109" font-size="13" fill="#98a6bc">Understand the attack surface.</text><text x="24" y="132" font-size="13" fill="#98a6bc">Explore ethical hacking.</text></g><g transform="translate(327 1)" font-family="Arial,Helvetica,sans-serif"><rect width="306" height="164" rx="14" fill="#111722" stroke="#30394b"/><text x="24" y="38" font-family="monospace" font-size="13" fill="#ac9fff">02 / SECURITY LAB</text><text x="24" y="78" font-size="21" font-weight="700" fill="#edf2fa">Network security</text><text x="24" y="109" font-size="13" fill="#98a6bc">Follow the packets.</text><text x="24" y="132" font-size="13" fill="#98a6bc">Understand the connections.</text></g><g transform="translate(653 1)" font-family="Arial,Helvetica,sans-serif"><rect width="306" height="164" rx="14" fill="#111722" stroke="#30394b"/><text x="24" y="38" font-family="monospace" font-size="13" fill="#79e2c0">03 / SECURITY LAB</text><text x="24" y="78" font-size="21" font-weight="700" fill="#edf2fa">Capture the flag</text><text x="24" y="109" font-size="13" fill="#98a6bc">Decode. Investigate. Solve.</text><text x="24" y="132" font-size="13" fill="#98a6bc">Practice through challenges.</text></g></svg>